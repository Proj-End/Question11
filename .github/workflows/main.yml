name: Unzip Questions Automatically

on:
  push:
    paths:
      - '**.zip'

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP to questions folder
        run: |
          unzip -o "*.zip"
          rm -f *.zip

      - name: Commit extracted JSON files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-extracted questions from ZIP"
          
